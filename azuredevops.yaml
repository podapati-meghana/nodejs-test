# azure-pipelines.yml
trigger:
  branches:
    include:
      - main   # adjust to your main branch

pool:
  vmImage: 'ubuntu-latest'

variables:
  azureSubscription: 'My-Service-Connection'    # Name of your service connection in DevOps
  appName: 'my-app-service'                     # Web App name
  resourceGroup: 'my-resource-group'            # Resource group name
  packageDir: '$(Build.ArtifactStagingDirectory)/drop'
  artifactName: 'drop'

stages:
- stage: Build
  displayName: 'Build Stage'
  jobs:
  - job: Build
    displayName: 'Build Application'
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '18.x'  # example for NodeJS app
      displayName: 'Use Node.js'

    - script: |
        npm install
        npm run build
      displayName: 'Install dependencies and build'

    - task: ArchiveFiles@2
      inputs:
        rootFolderOrFile: '$(System.DefaultWorkingDirectory)/dist'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/drop/$(appName).zip'
        replaceExistingArchive: true
      displayName: 'Archive build output'

    - publish: '$(Build.ArtifactStagingDirectory)/drop'
      artifact: 'drop'

- stage: Deploy
  displayName: 'Deploy Stage'
  dependsOn: Build
  jobs:
  - deployment: DeployWebApp
    displayName: 'Deploy to Azure Web App'
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: 'drop'

          - task: AzureWebApp@1
            displayName: 'Deploy to App Service using Run From Package'
            inputs:
              azureSubscription: '$(azureSubscription)'
              appName: '$(appName)'
              package: '$(Pipeline.Workspace)/drop/$(appName).zip'
              deploymentMethod: 'zipDeploy'

          # Optional: Enforce Run From Package setting explicitly
          - task: AzureAppServiceSettings@1
            displayName: 'Set WEBSITE_RUN_FROM_PACKAGE'
            inputs:
              azureSubscription: '$(azureSubscription)'
              appName: '$(appName)'
              appSettings: |
                [
                  {
                    "name": "WEBSITE_RUN_FROM_PACKAGE",
                    "value": "1"
                  }
                ]
